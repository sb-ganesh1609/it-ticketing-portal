<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Service Desk Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <h1 class="text-xl font-bold tracking-wide">IT Helpdesk Portal</h1>
      </div>
      <a href="/admin.html" class="text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition">IT Staff Dashboard</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-300 mb-8">
      <button id="tab-submit" onclick="switchTab('submit')" class="px-6 py-3 font-semibold text-blue-600 border-b-2 border-blue-600">Raise IT Request</button>
      <button id="tab-track" onclick="switchTab('track')" class="px-6 py-3 font-semibold text-gray-500 hover:text-gray-700">Track Request</button>
    </div>

    <!-- Submit Form Section -->
    <section id="section-submit" class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Submit a Ticket</h2>
      <p class="text-gray-600 text-sm mb-6">Describe your issue below and our IT support team will investigate promptly.</p>
      
      <div id="alert-message" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

      <form id="ticketForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Full Name *</label>
            <input type="text" id="requester_name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Email Address *</label>
            <input type="email" id="requester_email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Issue Category *</label>
            <select id="category" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="">Select Category</option>
              <option value="Hardware">Hardware (Laptop, Monitor, Peripherals)</option>
              <option value="Software">Software & Applications</option>
              <option value="Network">Network & VPN</option>
              <option value="Access">Access & Credentials</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Urgency / Priority *</label>
            <select id="priority" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="Low">Low (General Inquiry / Minor issue)</option>
              <option value="Medium" selected>Medium (Standard Work Impairment)</option>
              <option value="High">High (Severe Impact on Work)</option>
              <option value="Urgent">Urgent (System Down / Critical Failure)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Subject / Issue Title *</label>
          <input type="text" id="title" placeholder="e.g. Cannot connect to company VPN" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Detailed Description *</label>
          <textarea id="description" rows="4" placeholder="Provide relevant error messages, steps to reproduce, or details..." required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <button type="submit" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-lg transition shadow">Submit Ticket</button>
      </form>
    </section>

    <!-- Track Ticket Section -->
    <section id="section-track" class="hidden bg-white p-8 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Track Request Status</h2>
      <p class="text-gray-600 text-sm mb-6">Enter your Ticket Number (e.g., INC-123456) or your work email address.</p>

      <div class="flex gap-4 mb-8">
        <input type="text" id="searchQuery" placeholder="INC-XXXXXX or email@company.com" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="searchTickets()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition">Search</button>
      </div>

      <div id="searchResults" class="space-y-4"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
