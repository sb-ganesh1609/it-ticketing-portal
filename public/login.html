<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portal - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">IT Service Desk</h1>
      <p class="text-gray-500 text-sm mt-1">Please sign in to continue</p>
    </div>

    <div id="errorAlert" class="hidden mb-4 p-3 bg-red-100 border border-red-200 text-red-700 text-sm rounded-lg"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">Sign In</button>
    </form>

    <div class="mt-6 border-t pt-4 text-xs text-gray-500 space-y-1">
      <p><strong>Demo Admin Credentials:</strong> Username: <code>admin</code> | Password: <code>adminpassword</code></p>
      <p><strong>Demo User Credentials:</strong> Username: <code>user</code> | Password: <code>userpassword</code></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorAlert');
      errorBox.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          if (data.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/';
          }
        } else {
          errorBox.textContent = data.error || 'Login failed';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.textContent = 'Server connection error';
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
